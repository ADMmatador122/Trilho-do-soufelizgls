<style>
/* Layout: palco 3D em tela cheia atras; HUD no topo, paineis ancorados embaixo. */
:root {
  color-scheme: dark;
  --bg: #0d1226;
  --panel: #151c38;
  --panel-2: #1f2850;
  --line: #34407a;
  --ink: #f4f6ff;
  --muted: #a3add6;
  --accent: #ff4f9a;
  --accent-ink: #1a0912;
  --accent-2: #38b0ff;
  --coin: #ffc82e;
  --good: #5ceba3;
  --font-display: 'Bungee', 'Arial Black', Impact, sans-serif;
  --font-body: 'Rubik', system-ui, -apple-system, 'Segoe UI', sans-serif;
}
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font: 500 15px/1.4 var(--font-body);
  overflow: hidden;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  -webkit-user-select: none;
  user-select: none;
  touch-action: none;
}
#stage {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  display: block;
  background: var(--bg);
  touch-action: none;
}
.layer {
  position: fixed;
  inset: 0;
  box-sizing: border-box;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  pointer-events: none;
  padding-top: calc(env(safe-area-inset-top, 0px) + 14px);
  padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 16px);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.layer.center { justify-content: center; align-items: center; background: rgba(8, 11, 26, 0.55); }
.layer > * { pointer-events: auto; }
.layer.hud-layer > * { pointer-events: none; }
.layer.hud-layer .hud-btns { pointer-events: auto; }

.brand { pointer-events: none; }
.eyebrow {
  margin: 0 0 6px;
  font-size: 12px;
  font-weight: 700;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--accent);
}
h1 {
  margin: 0;
  font: 400 clamp(34px, 9vw, 64px)/0.95 var(--font-display);
  text-wrap: balance;
  text-shadow: 0 4px 0 rgba(0, 0, 0, 0.45);
}
h1 span { color: var(--accent-2); display: block; }
h2 { margin: 0 0 14px; font: 400 clamp(26px, 7vw, 38px)/1 var(--font-display); }

.panel {
  background: color-mix(in srgb, var(--panel) 92%, transparent);
  border: 2px solid var(--line);
  border-radius: 18px;
  padding: 14px;
  box-sizing: border-box;
}
.dock { width: 100%; max-width: 620px; margin: 0 auto; display: flex; flex-direction: column; gap: 10px; }
.skin-name { margin: 0; font-size: 14px; color: var(--muted); min-height: 2.8em; }
.skin-name b { display: block; color: var(--ink); font: 400 18px/1.1 var(--font-display); margin-bottom: 3px; }
.chips { display: flex; gap: 10px; overflow-x: auto; padding: 4px 2px 8px; scroll-snap-type: x proximity; }
.chip {
  flex: 0 0 auto;
  width: 92px;
  scroll-snap-align: start;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 6px;
  padding: 10px 6px 8px;
  background: var(--panel-2);
  color: var(--ink);
  border: 2px solid transparent;
  border-radius: 14px;
  font: 500 12px/1.15 var(--font-body);
  cursor: pointer;
}
.chip[aria-checked="true"] { border-color: var(--accent); background: #2a2f63; }
.chip .sw {
  width: 40px;
  height: 40px;
  border-radius: 50%;
  background: linear-gradient(var(--a) 0 34%, var(--c) 34% 62%, var(--b) 62%);
  box-shadow: inset 0 0 0 2px rgba(255, 255, 255, 0.18);
}
.chip .nm { text-align: center; min-height: 2.3em; }
.how { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 13px; color: var(--muted); }
.how kbd {
  display: inline-block;
  min-width: 1.6em;
  padding: 1px 6px;
  text-align: center;
  font: 700 12px/1.5 var(--font-body);
  color: var(--ink);
  background: var(--panel-2);
  border: 1px solid var(--line);
  border-radius: 6px;
}
.best { margin: 0; font-size: 13px; color: var(--muted); text-align: center; }
.best b { color: var(--ink); }

.btn {
  appearance: none;
  border: 0;
  border-radius: 14px;
  min-height: 48px;
  padding: 0 22px;
  font: 400 18px/1 var(--font-display);
  letter-spacing: 0.02em;
  cursor: pointer;
  color: var(--ink);
  background: var(--panel-2);
  box-shadow: inset 0 0 0 2px var(--line);
}
.btn.primary { background: var(--accent); color: var(--accent-ink); box-shadow: 0 4px 0 #b32a68; }
.btn:active { transform: translateY(2px); }
.btn:focus-visible, .chip:focus-visible, .pill:focus-visible { outline: 3px solid var(--accent-2); outline-offset: 2px; }

.hud-row { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
.stats { display: flex; gap: 22px; }
.stat { display: flex; flex-direction: column; text-shadow: 0 2px 0 rgba(0, 0, 0, 0.5); }
.stat .k { font-size: 11px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: #d6dcff; }
.stat .v { display: flex; align-items: center; gap: 7px; font: 400 clamp(24px, 6vw, 34px)/1.05 var(--font-display); font-variant-numeric: tabular-nums; }
.coin-ico { width: 20px; height: 20px; border-radius: 50%; background: var(--coin); box-shadow: inset 0 0 0 4px #e0a400, inset 0 0 0 6px var(--coin); display: inline-block; }
.hud-btns { display: flex; gap: 8px; }
.pill {
  appearance: none;
  min-height: 44px;
  min-width: 44px;
  padding: 0 14px;
  border: 2px solid var(--line);
  border-radius: 12px;
  background: color-mix(in srgb, var(--panel) 88%, transparent);
  color: var(--ink);
  font: 700 13px/1 var(--font-body);
  cursor: pointer;
}

.card { width: 100%; max-width: 420px; text-align: center; padding: 22px 18px; }
.results { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 0 0 18px; }
.results div { background: var(--panel-2); border-radius: 12px; padding: 10px 4px; }
.results dt { font-size: 11px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); }
.results dd { margin: 4px 0 0; font: 400 24px/1 var(--font-display); font-variant-numeric: tabular-nums; }
.actions { display: flex; flex-direction: column; gap: 10px; }
.record { color: var(--good); }
.fail { position: fixed; inset: 0; display: grid; place-items: center; padding: 24px; text-align: center; background: var(--bg); font-size: 17px; }

@media (prefers-reduced-motion: reduce) { .btn:active { transform: none; } }
</style>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function () {
  'use strict';

  var $ = function (id) { return document.getElementById(id); };
  var LANES = [-2.2, 0, 2.2];
  var SPAWN_Z = -120;
  var reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  /* ---------- armazenamento leve ---------- */
  var store = {
    get: function (k, d) { try { var v = localStorage.getItem('trilho:' + k); return v === null ? d : v; } catch (e) { return d; } },
    set: function (k, v) { try { localStorage.setItem('trilho:' + k, String(v)); } catch (e) {} }
  };

  /* ---------- skins (personagens estilizados, so com o que se ve nas fotos) ---------- */
  var SKINS = [
    { name: 'Cabelo Azul', desc: 'Coque azul, barba rosa, óculos e camisa preta.', skin: 0xe6b08e, hair: 0x2f6bff, hairStyle: 'bun', beard: 0xff4f9a, glasses: true, shirt: 0x16161a, pants: 0x2b3a63, shoes: 0xf2f2f2, detail: 'stripe', detailColor: 0xffc83a, smile: true },
    { name: 'Camisa Preta', desc: 'Careca, sorriso largo, camisa preta e jeans.', skin: 0x8d5b3d, hairStyle: 'bald', shirt: 0x17171a, pants: 0x3a6aa0, shoes: 0x222226, detail: 'none', smile: true },
    { name: 'Faixa Verde-Amarela', desc: 'Terno azul, cabelo e barba brancos, faixa verde e amarela.', skin: 0xe8bfa6, hair: 0xeeeeee, hairStyle: 'short', beard: 0xf1f1f1, shirt: 0x14264d, longSleeve: true, pants: 0x14264d, shoes: 0x111114, detail: 'sash', tie: 0xd9759a, smile: true },
    { name: 'Bigode Clássico', desc: 'Bigode fino, cabelo penteado e casaco escuro de gola alta.', skin: 0xdcc0a8, hair: 0x1d1816, hairStyle: 'swept', mustache: 0x1d1816, shirt: 0x2a2a30, longSleeve: true, pants: 0x232329, shoes: 0x111114, detail: 'collar' },
    { name: 'Moletom Marinho', desc: 'Cabelo grisalho, moletom azul-marinho com remendo vermelho.', skin: 0xd6a687, hair: 0xb7b7bd, hairStyle: 'swept', shirt: 0x16213f, longSleeve: true, pants: 0x20263a, shoes: 0xeeeeee, detail: 'zip', smile: true }
  ];
  function hex(n) { return '#' + n.toString(16).padStart(6, '0'); }

  /* ---------- renderer ---------- */
  var renderer;
  try {
    renderer = new THREE.WebGLRenderer({ canvas: $('stage'), antialias: true });
  } catch (err) {
    var f = document.createElement('div');
    f.className = 'fail';
    f.textContent = 'Seu navegador não conseguiu abrir o modo 3D (WebGL). Tente abrir em outro navegador.';
    document.body.appendChild(f);
    return;
  }

  var scene = new THREE.Scene();
  (function sky() {
    var c = document.createElement('canvas'); c.width = 8; c.height = 256;
    var x = c.getContext('2d');
    var g = x.createLinearGradient(0, 0, 0, 256);
    g.addColorStop(0, '#0a1233');
    g.addColorStop(0.3, '#23417f');
    g.addColorStop(0.48, '#d86a9a');
    g.addColorStop(0.6, '#ffae6b');
    g.addColorStop(1, '#ffae6b');
    x.fillStyle = g; x.fillRect(0, 0, 8, 256);
    scene.background = new THREE.CanvasTexture(c);
  })();
  scene.fog = new THREE.Fog(0xb86a98, 38, 140);

  var camera = new THREE.PerspectiveCamera(62, 1, 0.1, 240);
  scene.add(new THREE.HemisphereLight(0xcfd8ff, 0x3a2a4a, 0.95));
  var sunLight = new THREE.DirectionalLight(0xffd2a0, 0.85);
  sunLight.position.set(-6, 10, 6);
  scene.add(sunLight);

  function resize() {
    var w = window.innerWidth, h = window.innerHeight;
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    renderer.setSize(w, h, false);
    camera.aspect = w / h;
    camera.fov = (w / h < 0.75) ? 76 : 62;
    camera.updateProjectionMatrix();
  }
  window.addEventListener('resize', resize);
  resize();

  /* ---------- helpers de malha ---------- */
  var UNIT = new THREE.BoxGeometry(1, 1, 1);
  var matCache = {}, matBCache = {};
  function mat(c) { return matCache[c] || (matCache[c] = new THREE.MeshLambertMaterial({ color: c })); }
  function matB(c) { return matBCache[c] || (matBCache[c] = new THREE.MeshBasicMaterial({ color: c })); }
  function box(w, h, d, c, x, y, z, parent, basic) {
    var m = new THREE.Mesh(UNIT, basic ? matB(c) : mat(c));
    m.scale.set(w, h, d);
    m.position.set(x || 0, y || 0, z || 0);
    if (parent) parent.add(m);
    return m;
  }

  /* ---------- cenario ---------- */
  var ground = new THREE.Mesh(new THREE.PlaneGeometry(90, 330), mat(0x24243a));
  ground.rotation.x = -Math.PI / 2; ground.position.set(0, 0, -130); scene.add(ground);
  var bed = new THREE.Mesh(new THREE.PlaneGeometry(7.6, 330), mat(0x4b4659));
  bed.rotation.x = -Math.PI / 2; bed.position.set(0, 0.01, -130); scene.add(bed);
  box(0.5, 0.3, 330, 0x5a5a6e, -3.95, 0.15, -130, scene);
  box(0.5, 0.3, 330, 0x5a5a6e, 3.95, 0.15, -130, scene);
  LANES.forEach(function (lx) {
    box(0.12, 0.12, 330, 0xcdd2da, lx - 0.55, 0.14, -130, scene);
    box(0.12, 0.12, 330, 0xcdd2da, lx + 0.55, 0.14, -130, scene);
  });

  var SLEEP_N = 72, SLEEP_GAP = 2.2, sleepers = [];
  for (var si = 0; si < SLEEP_N; si++) {
    sleepers.push(box(7.2, 0.1, 0.38, 0x6b4a3a, 0, 0.06, 14 - si * SLEEP_GAP, scene));
  }

  var sun = new THREE.Mesh(new THREE.CircleGeometry(17, 48), new THREE.MeshBasicMaterial({ color: 0xffd9a0, fog: false }));
  sun.position.set(12, 22, -175); scene.add(sun);

  function windowTexture(base) {
    var c = document.createElement('canvas'); c.width = c.height = 64;
    var x = c.getContext('2d');
    x.fillStyle = base; x.fillRect(0, 0, 64, 64);
    for (var r = 0; r < 8; r++) {
      for (var q = 0; q < 8; q++) {
        var lit = Math.random() < 0.5;
        x.fillStyle = lit ? (Math.random() < 0.7 ? '#ffd98a' : '#9fe0ff') : '#0d1130';
        x.fillRect(q * 8 + 2, r * 8 + 2, 4, 5);
      }
    }
    var t = new THREE.CanvasTexture(c);
    t.wrapS = t.wrapT = THREE.RepeatWrapping;
    t.magFilter = THREE.NearestFilter;
    return t;
  }
  var bMats = ['#23264f', '#2f2a5e', '#1f3a5c', '#3b2a52'].map(function (b) {
    return new THREE.MeshBasicMaterial({ map: windowTexture(b) });
  });
  function makeBuilding(w, h, d) {
    var g = new THREE.BoxGeometry(w, h, d);
    var uv = g.attributes.uv;
    var faces = [[d, h], [d, h], [w, d], [w, d], [w, h], [w, h]];
    for (var f = 0; f < 6; f++) {
      var sx = faces[f][0] / 6, sy = faces[f][1] / 6;
      for (var i = 0; i < 4; i++) {
        var k = f * 4 + i;
        uv.setXY(k, uv.getX(k) * sx, uv.getY(k) * sy);
      }
    }
    uv.needsUpdate = true;
    var m = new THREE.Mesh(g, bMats[(Math.random() * bMats.length) | 0]);
    m.position.y = h / 2;
    return m;
  }

  var BUILD_N = 15, BUILD_GAP = 11, BUILD_LEN = BUILD_N * BUILD_GAP, buildings = [];
  [-1, 1].forEach(function (side) {
    for (var i = 0; i < BUILD_N; i++) {
      var w = 6 + Math.random() * 6, d = 7 + Math.random() * 4, h = 9 + Math.random() * 26;
      var m = makeBuilding(w, h, d);
      m.position.x = side * (8 + w / 2 + Math.random() * 4);
      m.position.z = 16 - i * BUILD_GAP - Math.random() * 3;
      scene.add(m);
      buildings.push(m);
    }
  });

  var POLE_N = 10, POLE_GAP = 18, POLE_LEN = POLE_N * POLE_GAP, poles = [];
  [-1, 1].forEach(function (side) {
    for (var i = 0; i < POLE_N; i++) {
      var p = new THREE.Group();
      box(0.22, 6.5, 0.22, 0x2c2c3a, 0, 3.25, 0, p);
      box(2.2, 0.16, 0.16, 0x2c2c3a, -side * 0.9, 6, 0, p);
      box(0.12, 0.12, 0.12, 0xffe08a, -side * 1.9, 6.15, 0, p, true);
      p.position.set(side * 5.1, 0, 12 - i * POLE_GAP);
      scene.add(p);
      poles.push(p);
    }
  });

  function scrollWorld(d) {
    var i;
    for (i = 0; i < sleepers.length; i++) {
      sleepers[i].position.z += d;
      if (sleepers[i].position.z > 14) sleepers[i].position.z -= SLEEP_N * SLEEP_GAP;
    }
    for (i = 0; i < buildings.length; i++) {
      buildings[i].position.z += d;
      if (buildings[i].position.z > 18) buildings[i].position.z -= BUILD_LEN;
    }
    for (i = 0; i < poles.length; i++) {
      poles[i].position.z += d;
      if (poles[i].position.z > 14) poles[i].position.z -= POLE_LEN;
    }
  }

  /* ---------- personagem ---------- */
  function buildChar(s) {
    var root = new THREE.Group();
    var g = new THREE.Group(); root.add(g);
    var sc = 0.92; root.scale.set(sc, sc, sc);

    var legL = new THREE.Group(); legL.position.set(-0.19, 0.85, 0); g.add(legL);
    var legR = new THREE.Group(); legR.position.set(0.19, 0.85, 0); g.add(legR);
    [legL, legR].forEach(function (lg) {
      box(0.3, 0.85, 0.32, s.pants, 0, -0.425, 0, lg);
      box(0.32, 0.14, 0.44, s.shoes, 0, -0.78, -0.06, lg);
    });

    box(0.8, 0.82, 0.44, s.shirt, 0, 1.26, 0, g);

    function arm(side) {
      var a = new THREE.Group(); a.position.set(side * 0.55, 1.6, 0); g.add(a);
      box(0.22, 0.4, 0.26, s.shirt, 0, -0.2, 0, a);
      box(0.2, 0.4, 0.24, s.longSleeve ? s.shirt : s.skin, 0, -0.6, 0, a);
      if (s.longSleeve) box(0.2, 0.12, 0.22, s.skin, 0, -0.86, 0, a);
      return a;
    }
    var armL = arm(-1), armR = arm(1);

    box(0.2, 0.12, 0.2, s.skin, 0, 1.7, 0, g);
    var head = new THREE.Group(); head.position.set(0, 1.97, 0); g.add(head);
    box(0.56, 0.58, 0.56, s.skin, 0, 0, 0, head);

    // cabelo
    var hr = s.hair;
    if (s.hairStyle === 'bun') {
      box(0.6, 0.16, 0.6, hr, 0, 0.3, 0, head);
      box(0.6, 0.3, 0.12, hr, 0, 0.15, 0.24, head);
      box(0.24, 0.26, 0.24, hr, 0, 0.5, 0.04, head);
      box(0.12, 0.22, 0.12, hr, 0, 0.7, 0.04, head);
      var tuft = box(0.08, 0.2, 0.08, hr, 0.1, 0.74, 0.04, head); tuft.rotation.z = -0.5;
      var tuft2 = box(0.08, 0.2, 0.08, hr, -0.1, 0.74, 0.04, head); tuft2.rotation.z = 0.5;
    } else if (s.hairStyle === 'short') {
      box(0.6, 0.15, 0.6, hr, 0, 0.3, 0, head);

      music(dt);
      score = Math.floor(dist * 0.3) + coinsRun * 10;
      setText(elScore, score); setText(elCoins, coinsRun);
    } else if (state === 'menu') {
      scrollWorld(4 * dt);
      movePlayer(dt);
    }

    pose(dt);

    var targetRot = state === 'menu' ? Math.PI + Math.sin(clock * 0.9) * 0.55 : 0;
    rotY += (targetRot - rotY) * Math.min(1, dt * 6);
    pg.rotation.y = rotY;
    pg.position.set(player.x, player.y, 0);
    var sh = Math.max(0.35, 1 - player.y * 0.3);
    blob.position.x = player.x; blob.scale.set(sh, sh, sh);

    if (state === 'menu') { tPos.set(0, 1.5, 4.3); tLook.set(0, 0.7, 0); }
    else { tPos.set(player.x * 0.55, 4.3, 7.4); tLook.set(player.x * 0.45, 1.2, -9); }
    var ck = 1 - Math.exp(-dt * 4);
    camPos.lerp(tPos, ck); camLook.lerp(tLook, ck);
    camera.position.copy(camPos);
    if (shake > 0) {
      shake -= dt;
      if (!reduceMotion) {
        camera.position.x += (Math.random() - 0.5) * shake * 0.5;
        camera.position.y += (Math.random() - 0.5) * shake * 0.5;
      }
    }
    camera.lookAt(camLook);
  }

  var last = performance.now();
  function frame(now) {
    requestAnimationFrame(frame);
    var dt = Math.min(0.05, (now - last) / 1000); last = now;
    clock += dt;
    if (state !== 'paused') update(dt);
    renderer.render(scene, camera);
  }

  /* ---------- inicio ---------- */
  var saved = parseInt(store.get('skin', '0'), 10);
  selectSkin(saved >= 0 && saved < SKINS.length ? saved : 0);
  syncSoundBtn();
  refreshMenuStats();
  showOnly('menu');
  requestAnimationFrame(frame);
})();
</script>

</body></html>
